{% extends 'base.html' %}
{% load static %}

{% block title %}Fjalëkalimi U Ndryshua - Open Map{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-box" style="text-align: center;">
            <div class="auth-header">
                <i class="fas fa-check" style="font-size: 3rem; color: var(--success); margin-bottom: 1rem;"></i>
                <h1>Fjalëkalimi u Përditësua</h1>
                <p>Tani mund të hyni me fjalëkalimin tuaj të ri.</p>
            </div>

            <div class="auth-footer">
                <a href="{% url 'users:login' %}" class="btn btn-primary">Hyr</a>
                <a href="{% url 'core:home' %}" class="btn btn-secondary">Kthehu në Shtëpi</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
