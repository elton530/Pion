{% load static i18n %}

<!DOCTYPE html>
<html lang="sq" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Open Map — Zbulo Natyrën Shqiptare{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Platforma më e mirë për guidat lokale dhe aventurat autentike në natyrë në Shqipëri{% endblock %}">
    
    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    
    <!-- Fontet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- CSS GLOBALE (funksionojnë kudo) -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    
    <!-- CSS specifike për faqen -->
    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Skip link -->
    <a href="#main-content" class="skip-to-content">
        Kalo te përmbajtja kryesore
    </a>
    
    <!-- Header (global) -->
    {% include 'header.html' %}
    
    <!-- Përmbajtja kryesore -->
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer (global) -->
    {% include 'footer.html' %}
    
    <!-- Scripts globale -->
    <script src="{% static 'js/header.js' %}"></script>
    <script src="{% static 'js/footer.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
