{% load static %}

<!DOCTYPE html>
<html lang="sq" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO dhe bazë -->
    <title>{% block title %}Open Map — Zbulo Natyrën Shqiptare{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Platforma për guidat lokale dhe aventurat në natyrë në Shqipëri{% endblock %}">
    
    <!-- Favicon (shto kur ke ikonën) -->
    <!-- <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon"> -->

    <!-- Fontet dhe ikonat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS globale dhe variabla -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/hed_foot.css' %}">

    <!-- CSS shtesë nga faqet individuale -->
    {% block extra_css %}{% endblock %}

    <!-- Tailwind ose Bootstrap nëse do t'i shtosh më vonë -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
</head>

<body class="bg-gray-50 text-gray-900 antialiased">

    <!-- Header i përbashkët -->
    {% include 'header.html' %}

    <!-- Përmbajtja kryesore -->
    <main class="min-h-screen">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer i përbashkët -->
    {% include 'footer.html' %}

    <!-- Mobile menu script (vetëm nëse ke menu hamburger) -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.querySelector('.menu-toggle');
            const mobileMenu = document.getElementById('mobileMenu');
            const menuClose = document.querySelector('.menu-close');

            if (menuToggle && mobileMenu) {
                menuToggle.addEventListener('click', () => {
                    mobileMenu.classList.toggle('active');
                });
            }

            if (menuClose && mobileMenu) {
                menuClose.addEventListener('click', () => {
                    mobileMenu.classList.remove('active');
                });
            }

            // Mbyll menynë kur klikohet jashtë
            if (mobileMenu) {
                mobileMenu.addEventListener('click', (e) => {
                    if (e.target === mobileMenu) {
                        mobileMenu.classList.remove('active');
                    }
                });
            }
        });
    </script>

    <!-- JS shtesë nga faqet individuale -->
    {% block extra_js %}{% endblock %}

</body>
</html>
