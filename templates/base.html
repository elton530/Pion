{% load static %}

<!DOCTYPE html>
<html lang="sq" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO bazë – mund ta override-osh në faqe individuale -->
    <title>{% block title %}Pion — Zbulo Natyrën Shqiptare{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Platforma më e mirë për guidat lokale dhe aventurat autentike në natyrë në Shqipëri{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}ture Shqipëri, guida lokale, aventurë natyrë, hiking, turizëm Shqipëri{% endblock %}">
    
    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">

    <!-- Fontet – preconnect për shpejtësi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS globale -->
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">

    <!-- CSS shtesë për faqen aktuale -->
    {% block extra_css %}{% endblock %}
</head>

<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col">

    <!-- Header i përbashkët -->
    {% include 'header.html' %}

    <!-- Përmbajtja kryesore – merr hapësirë të mbetur -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer i përbashkët -->
    {% include 'footer.html' %}

    <!-- JavaScript për header (mobile menu, dropdown, etj.) -->
    <script src="{% static 'js/header.js' %}" defer></script>

    <!-- JavaScript për footer (nëse ka interaktivitet) -->
    <script src="{% static 'js/footer.js' %}" defer></script>

    <!-- JS shtesë për faqen aktuale -->
    {% block extra_js %}{% endblock %}

</body>
</html>
